<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Ultra AI Singing Photo</title>

<script src="https://cdn.jsdelivr.net/npm/@ffmpeg/ffmpeg@0.12.6/dist/ffmpeg.min.js"></script>

<style>
body{
    margin:0;
    font-family:Arial;
    background:#0f0f18;
    color:white;
    padding:20px;
}

.container{
    max-width:800px;
    margin:auto;
    background:#1b1b28;
    padding:20px;
    border-radius:20px;
}

h1{
    text-align:center;
    color:#ffd54f;
}

input, textarea, button{
    width:100%;
    margin-top:12px;
    padding:14px;
    border-radius:14px;
    border:none;
    box-sizing:border-box;
}

button{
    background:#ffd54f;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    opacity:0.9;
}

img, video{
    width:100%;
    border-radius:18px;
    margin-top:20px;
}

.progress{
    height:18px;
    background:#333;
    border-radius:99px;
    overflow:hidden;
    margin-top:20px;
}

.bar{
    height:100%;
    width:0%;
    background:#ffd54f;
    transition:0.3s;
}

.status{
    margin-top:10px;
    color:#ccc;
}

.download{
    display:none;
    margin-top:20px;
    text-align:center;
}

.download a{
    background:#2ecc71;
    padding:14px 22px;
    border-radius:14px;
    color:white;
    text-decoration:none;
    display:inline-block;
}
</style>
</head>

<body>

<div class="container">

<h1>🎤 Ultra AI Singing Photo</h1>

<input type="file" id="photo" accept="image/*">

<input type="file" id="audio" accept="audio/*">

<textarea id="prompt">
Hidupkan gambar ini dengan gerakan sinematik dan animasi yang halus.
</textarea>

<button onclick="generateVideo()">
🚀 Generate MP4 HD
</button>

<div class="progress">
<div class="bar" id="bar"></div>
</div>

<div class="status" id="status">
Siap digunakan.
</div>

<img id="preview" style="display:none;">

<video id="video" controls style="display:none;"></video>

<div class="download" id="download">
<a id="downloadBtn" download="ultra-ai-video.mp4">
⬇️ Download MP4
</a>
</div>

</div>

<script>

const photoInput = document.getElementById("photo");
const audioInput = document.getElementById("audio");
const preview = document.getElementById("preview");
const video = document.getElementById("video");

photoInput.addEventListener("change", ()=>{
    const file = photoInput.files[0];
    preview.src = URL.createObjectURL(file);
    preview.style.display = "block";
});

async function generateVideo(){

    if(!photoInput.files[0]){
        alert("Upload foto terlebih dahulu");
        return;
    }

    if(!audioInput.files[0]){
        alert("Upload audio terlebih dahulu");
        return;
    }

    const status = document.getElementById("status");
    const bar = document.getElementById("bar");

    const steps = [
        "Menganalisis wajah...",
        "Menganalisis audio...",
        "Membuat animasi AI...",
        "Rendering MP4 HD...",
        "Selesai..."
    ];

    for(let i=0;i<steps.length;i++){
        status.innerHTML = steps[i];
        bar.style.width = ((i+1)/steps.length*100)+"%";
        await new Promise(r=>setTimeout(r,1500));
    }

    // Demo AI Animation
    // Simulasi video menggunakan gambar

    video.poster = preview.src;
    video.style.display = "block";

    const download = document.getElementById("download");
    const downloadBtn = document.getElementById("downloadBtn");

    download.style.display = "block";

    downloadBtn.href = preview.src;

    status.innerHTML =
    "Ultra AI demo aktif. Tahap berikutnya dapat dihubungkan dengan LivePortrait + Wav2Lip.";

}

</script>

</body>
</html>
