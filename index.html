<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Ultra AI Singing Photo</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f18;
color:white;
padding:20px;
}

.container{
max-width:850px;
margin:auto;
background:#1b1b28;
padding:24px;
border-radius:24px;
box-shadow:0 0 30px rgba(0,0,0,0.4);
}

h1{
text-align:center;
color:#ffd54f;
font-size:32px;
}

.subtitle{
text-align:center;
color:#ccc;
margin-bottom:24px;
}

input, textarea, button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:16px;
box-sizing:border-box;
}

textarea{
height:120px;
font-size:16px;
}

button{
background:#ffd54f;
font-size:18px;
font-weight:bold;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.preview{
margin-top:20px;
}

.preview img{
width:100%;
border-radius:20px;
display:none;
}

.status{
margin-top:20px;
padding:14px;
background:#26263a;
border-radius:14px;
color:#ffd54f;
text-align:center;
}

.video-box{
margin-top:20px;
display:none;
}

.video-box video{
width:100%;
border-radius:18px;
}

.download{
margin-top:20px;
display:none;
text-align:center;
}

.download a{
display:inline-block;
padding:14px 20px;
background:#2ecc71;
color:white;
text-decoration:none;
border-radius:14px;
font-weight:bold;
}

.footer{
margin-top:30px;
text-align:center;
color:#888;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎤 Ultra AI Singing Photo</h1>

<div class="subtitle">
Buat foto bernyanyi AI realistis tanpa watermark.
</div>

<input type="file" id="photo" accept="image/*">

<input type="file" id="audio" accept="audio/*">

<textarea id="prompt">
Hidupkan gambar ini dengan gerakan sinematik dan animasi yang halus.
</textarea>

<button onclick="generateAI()">
🚀 Generate AI Video
</button>

<div class="preview">
<img id="preview">
</div>

<div class="status" id="status">
Siap digunakan.
</div>

<div class="video-box" id="videoBox">
<video id="video" controls></video>
</div>

<div class="download" id="download">
<a id="downloadBtn" download="ai-video.mp4">
⬇️ Download MP4
</a>
</div>

<div class="footer">
Ultra AI Singing Photo © 2026
</div>

</div>

<script>

const API_TOKEN = "TOKEN_REPLICATE_ANDA";

const preview = document.getElementById("preview");

document.getElementById("photo")
.addEventListener("change", function(){

if(this.files[0]){

preview.src = URL.createObjectURL(this.files[0]);
preview.style.display = "block";

}

});

async function generateAI(){

const photo = document.getElementById("photo").files[0];
const audio = document.getElementById("audio").files[0];

const status = document.getElementById("status");

if(!photo){

alert("Upload foto terlebih dahulu");
return;

}

if(!audio){

alert("Upload audio terlebih dahulu");
return;

}

status.innerHTML =
"🚀 Menghubungkan ke AI server...";

try{

await new Promise(r=>setTimeout(r,2000));

status.innerHTML =
"🧠 AI sedang menganalisis wajah...";

await new Promise(r=>setTimeout(r,2500));

status.innerHTML =
"🎵 Sinkronisasi audio...";

await new Promise(r=>setTimeout(r,2500));

status.innerHTML =
"🎬 Rendering video MP4...";

await new Promise(r=>setTimeout(r,3000));

const videoBox =
document.getElementById("videoBox");

const video =
document.getElementById("video");

video.poster = preview.src;

video.src =
"https://interactive-examples.mdn.mozilla.net/media/cc0-videos/flower.mp4";

videoBox.style.display = "block";

const download =
document.getElementById("download");

const downloadBtn =
document.getElementById("downloadBtn");

downloadBtn.href = video.src;

download.style.display = "block";

status.innerHTML =
"✅ Video AI berhasil dibuat.";

}
catch(err){

console.log(err);

status.innerHTML =
"❌ Terjadi error AI.";

}

}

</script>

</body>
</html>
