<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>AI Singing Photo Premium</title>

<style>

body{
margin:0;
font-family:Arial;
background:#0f0f18;
color:white;
padding:20px;
}

.container{
max-width:850px;
margin:auto;
background:#1a1a28;
padding:24px;
border-radius:24px;
box-shadow:0 0 30px rgba(0,0,0,0.5);
}

h1{
text-align:center;
color:#ffd54f;
font-size:32px;
}

.subtitle{
text-align:center;
color:#ccc;
margin-bottom:25px;
}

input, textarea, button{
width:100%;
padding:14px;
margin-top:14px;
border:none;
border-radius:16px;
box-sizing:border-box;
}

textarea{
height:120px;
}

button{
background:#ffd54f;
font-weight:bold;
font-size:18px;
cursor:pointer;
}

button:hover{
opacity:0.9;
}

.preview{
margin-top:25px;
}

img{
width:100%;
border-radius:18px;
display:none;
}

.actions{
margin-top:25px;
display:grid;
gap:14px;
}

.ai-btn{
display:block;
text-align:center;
padding:16px;
border-radius:18px;
text-decoration:none;
font-weight:bold;
font-size:18px;
color:white;
}

.did{
background:#5c6bc0;
}

.heygen{
background:#26a69a;
}

.tokking{
background:#ef5350;
}

.capcut{
background:#8e24aa;
}

.footer{
margin-top:30px;
text-align:center;
color:#999;
font-size:14px;
}

</style>
</head>

<body>

<div class="container">

<h1>🎤 AI Singing Photo Premium</h1>

<div class="subtitle">
Buat foto bernyanyi AI dengan kualitas HD dan animasi realistis.
</div>

<input type="file" id="photo" accept="image/*">

<input type="file" id="audio" accept="audio/*">

<textarea>
Hidupkan gambar ini dengan gerakan sinematik dan animasi yang halus.
</textarea>

<button onclick="previewPhoto()">
🚀 Preview AI Project
</button>

<div class="preview">
<img id="preview">
</div>

<div class="actions">

<a class="ai-btn did"
href="https://studio.d-id.com/"
target="_blank">
🎬 Generate with D-ID AI
</a>

<a class="ai-btn heygen"
href="https://www.heygen.com/"
target="_blank">
🤖 Generate with HeyGen
</a>

<a class="ai-btn tokking"
href="https://tokkingheads.com/"
target="_blank">
🗣️ Generate with TokkingHeads
</a>

<a class="ai-btn capcut"
href="https://www.capcut.com/"
target="_blank">
✨ Generate with CapCut AI
</a>

</div>

<div class="footer">
Ultra AI Singing Photo © 2026
</div>

</div>

<script>

function previewPhoto(){

const photo = document.getElementById("photo");

if(!photo.files[0]){
alert("Upload foto terlebih dahulu");
return;
}

const preview = document.getElementById("preview");

preview.src = URL.createObjectURL(photo.files[0]);

preview.style.display = "block";

}

</script>

</body>
</html>
